<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" aria-labelledby="title desc" role="img" viewBox="0 0 1200 450"><title id="title">RuView: invisible signals, visible possibility</title><desc id="desc">Animated conceptual RF room with an articulated pose, moving scan plane and propagating waves. Illustration only, not a sensor measurement.</desc><defs><linearGradient id="wash" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#102749"/><stop offset=".55" stop-color="#071429"/><stop offset="1" stop-color="#03091a"/></linearGradient><linearGradient id="accent"><stop stop-color="#9ee7ff"/><stop offset="1" stop-color="#348bff"/></linearGradient><radialGradient id="halo"><stop stop-color="#348bff" stop-opacity=".17"/><stop offset="1" stop-color="#348bff" stop-opacity="0"/></radialGradient></defs><style>@keyframes float{0%{transform:translate(0,0)}50%{transform:translate(3px,-10px)}}@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(-76px)}}@keyframes limb{0%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}@keyframes layer{50%{transform:translateY(-5px)}}@keyframes spark{50%{opacity:.25}}@keyframes wave{0%{transform:scale(.5);opacity:.7}}text{font-family:&quot;Avenir Next&quot;,&quot;Segoe UI Variable Display&quot;,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace;letter-spacing:1.6px}.float{animation:float 5s ease-in-out infinite}.flow{stroke-dasharray:5 12;animation:flow 5s linear infinite}.scan{animation:scan 7s ease-in-out infinite}.spark{animation:spark 3.5s ease-in-out infinite}.wave{transform-box:fill-box;transform-origin:center;animation:wave 4s ease-out infinite}.limb{animation:limb 3s ease-in-out infinite;transform-origin:0 -18px}.stride{animation:limb 3s ease-in-out infinite reverse;transform-origin:5px 16px}.layer{animation:layer 6s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="